<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>川瓣主题控制台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <div class="header">
    <img src="/logo.svg" alt="Chuanban Logo" class="logo-img">
    <div class="header-text">
      <h1>川瓣主题与指标</h1>
      <p>Antigravity 原生扩展 · 宿主生命周期托管</p>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>CDP 运行状态</span>
      <span id="cdp-badge" class="badge badge-disconnected">
        <span class="badge-dot"></span>
        <span id="cdp-status-text">检测中...</span>
      </span>
    </div>
    <div class="status-grid">
      <div class="status-item">
        <span class="status-label">调试端口</span>
        <span class="status-val" id="val-port">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">挂载目标</span>
        <span class="status-val" id="val-targets">0 个窗口</span>
      </div>
      <div class="status-item">
        <span class="status-label">样式体积</span>
        <span class="status-val" id="val-size">-</span>
      </div>
      <div class="status-item">
        <span class="status-label">核心版本</span>
        <span class="status-val" id="val-version">-</span>
      </div>
    </div>
    <div class="action-row">
      <button id="btn-reload" class="btn btn-primary">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        实时重载样式
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">主题风格预设</div>
    <div class="preset-selector">
      <button class="preset-chip active" data-preset="high-contrast">高对比暖白</button>
      <button class="preset-chip" data-preset="claude-dark">Claude 暗色</button>
      <button class="preset-chip" data-preset="default">原生跟随</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">功能模块</div>
    <div class="toggle-list">
      <div class="toggle-item">
        <div class="toggle-info">
          <span class="toggle-name">底部组件共线排版</span>
          <span class="toggle-desc">遥测/模型/模式右对齐 · 工具栏下移居左</span>
        </div>
        <span class="status-val" style="color: var(--cb-success);">已激活</span>
      </div>
      <div class="toggle-item">
        <div class="toggle-info">
          <span class="toggle-name">更纱黑体字阶体系</span>
          <span class="toggle-desc">Sarasa UI SC 与代码等宽字体排版</span>
        </div>
        <span class="status-val" style="color: var(--cb-success);">已激活</span>
      </div>
      <div class="toggle-item">
        <div class="toggle-info">
          <span class="toggle-name">输入框微浮雕三态</span>
          <span class="toggle-desc">正常、聚焦与激活态边界高光反馈</span>
        </div>
        <span class="status-val" style="color: var(--cb-success);">已激活</span>
      </div>
      <div class="toggle-item">
        <div class="toggle-info">
          <span class="toggle-name">实时指标胶囊</span>
          <span class="toggle-desc">会话 Token/s 与 TTFT 硬件遥测</span>
        </div>
        <span class="status-val" id="val-metrics-status" style="color: var(--cb-success);">运行中</span>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">已同步最新样式</div>

  <div class="footer-note">
    生命周期已绑定 Antigravity 宿主进程<br>
    随应用启动即注入，应用退出即终止，无需常驻守护
  </div>

  <script src="/app.js"></script>
</body>
</html>
