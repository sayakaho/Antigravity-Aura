name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Plugin Distribution
        run: bun run build

      - name: Package Distribution Zip
        run: |
          cd dist
          zip -r ../aura-dashboard-${{ github.ref_name }}.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: aura-dashboard-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
